<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhập môn Học máy — Trang tự học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --paper-line:#DCD6C4;
    --ink:#242645;
    --ink-soft:#5C5C7A;
    --tab:#2E3159;
    --highlight:#E8A33D;
    --highlight-soft:#F6DDAE;
    --done:#3E7D5C;
    --done-bg:#DCEBDF;
    --card:#FFFDF8;
    --bad:#B0493F;
    --bad-bg:#F3DCDA;
    --shadow:rgba(36,38,69,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px),
      var(--paper);
    background-size: 28px 28px;
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
  }

  /* ===== NAV ===== */
  .nav{
    position:sticky; top:0; z-index:50;
    background:var(--tab);
    color:#fff;
    display:flex; align-items:center; gap:4px;
    padding:10px 16px;
    box-shadow:0 2px 8px var(--shadow);
  }
  .nav .brand{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    margin-right:14px; letter-spacing:.02em; white-space:nowrap;
  }
  .nav a.tab{
    color:#D9D9EC; text-decoration:none; font-size:12px;
    padding:7px 11px; border-radius:4px; letter-spacing:.03em;
  }
  .nav a.tab:hover{background:rgba(255,255,255,.08); color:#fff;}
  .nav a.tab.active{background:var(--highlight); color:var(--tab); font-weight:600;}

  .wrap{max-width:820px;margin:0 auto; padding:28px 16px 80px;}

  /* ===== HEADER ===== */
  header{margin-bottom:22px;}
  .eyebrow{
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:6px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:clamp(24px,5vw,34px);
    margin:0 0 6px; color:var(--ink); line-height:1.15;
  }
  .sub{color:var(--ink-soft); font-size:13.5px; max-width:62ch; line-height:1.55;}

  .back{display:inline-block; margin-bottom:12px; color:var(--tab);
    text-decoration:none; font-size:12.5px; letter-spacing:.03em;}
  .back:hover{text-decoration:underline;}

  /* ===== CARDS ===== */
  .card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:6px;
    box-shadow:0 2px 0 var(--shadow);
    margin-top:16px;
  }
  .card-head{
    padding:13px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-bottom:1px solid var(--paper-line);
  }
  .card-head .title{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;}
  .card-body{padding:14px 16px;}

  /* ===== PROGRESS ===== */
  .progress-panel{margin-top:18px;}
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .progress-label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);}
  .progress-num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;color:var(--ink);}
  .progress-track{height:10px;background:var(--paper);border:1px solid var(--paper-line);border-radius:6px;overflow:hidden;}
  .progress-fill{
    height:100%;
    background:repeating-linear-gradient(45deg, var(--highlight), var(--highlight) 8px, var(--highlight-soft) 8px, var(--highlight-soft) 16px);
    width:0%; transition:width .4s ease;
  }
  .progress-meta{margin-top:7px;font-size:11.5px;color:var(--ink-soft);}

  /* ===== DASHBOARD TIMELINE ===== */
  .timeline{margin-top:18px;}
  .tl-item{
    display:flex; gap:14px; padding:11px 4px;
    border-bottom:1px dotted var(--paper-line); cursor:pointer; align-items:flex-start;
  }
  .tl-item:last-child{border-bottom:none;}
  .tl-item:hover{background:rgba(232,163,61,.06);}
  .tl-num{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:12px; color:#fff; background:var(--tab);
    width:40px;height:40px;border-radius:6px; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .tl-item.done .tl-num{background:var(--done);}
  .tl-info{flex:1;min-width:0;}
  .tl-title{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14.5px; color:var(--ink);}
  .tl-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.45;}
  .tl-status{font-size:11px; white-space:nowrap; color:var(--ink-soft); font-weight:600; margin-top:3px;}

  /* ===== WEEK VIEW ===== */
  .week-tag{
    display:inline-block; font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    background:var(--highlight-soft); color:var(--tab); font-weight:600;
    padding:3px 8px; border-radius:3px; margin-right:8px;
  }
  .week-tag.mini{background:var(--done-bg); color:var(--done);}

  .lesson{padding:12px 0; border-bottom:1px dotted var(--paper-line);}
  .lesson:last-child{border-bottom:none;}
  .lesson .l-head{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; margin-bottom:4px;}
  .lesson .l-meta{font-size:11px; color:var(--ink-soft); margin-bottom:8px; letter-spacing:.03em;}
  .lesson p, .lesson li{font-size:13px; line-height:1.6; color:var(--ink);}
  .lesson ul{margin:6px 0; padding-left:20px;}
  .lesson .concept{
    background:var(--highlight-soft); border-left:3px solid var(--highlight);
    padding:8px 12px; margin:8px 0; border-radius:0 4px 4px 0; font-size:13px; line-height:1.55;
  }
  .lesson .code{
    background:#23253F; color:#E9E9F5; border-radius:4px;
    padding:10px 12px; margin:8px 0; font-size:12px; line-height:1.6; overflow-x:auto;
  }
  .lesson .code .c{color:#8FA3C9; font-style:italic;} /* comment */
  .lesson .code .k{color:#E8A33D; font-weight:600;}      /* keyword */
  .lesson .code .s{color:#8FBF8F;}                        /* string */

  /* Checklist */
  .check{display:flex; align-items:flex-start; gap:10px; padding:7px 2px;}
  .check input{width:17px;height:17px;flex-shrink:0;margin-top:2px;
    accent-color:var(--done); cursor:pointer;}
  .check .t{flex:1; font-size:13px; line-height:1.55;}
  .check.done .t{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--paper-line);}

  /* Self-check questions */
  .q{background:var(--card); border:1px solid var(--paper-line); border-radius:6px;
     padding:12px 14px; margin:9px 0;}
  .q .qt{font-weight:600; font-size:13px; margin-bottom:7px;}
  .q .opt{display:block; padding:6px 9px; border:1px solid var(--paper-line); border-radius:4px;
    margin:5px 0; font-size:12.5px; cursor:pointer; line-height:1.5;}
  .q .opt:hover{border-color:var(--highlight);}
  .q .opt.correct{border-color:var(--done); background:var(--done-bg);}
  .q .opt.wrong{border-color:var(--bad); background:var(--bad-bg);}
  .q .explain{font-size:12px; color:var(--ink-soft); margin-top:7px; display:none; line-height:1.5;}
  .q .explain.show{display:block;}
  .q.revealed .opt{cursor:default;}
  .q.revealed .opt:hover{border-color:var(--paper-line);}
  .q.revealed .opt.correct:hover{border-color:var(--done);}
  .q.revealed .opt.wrong:hover{border-color:var(--bad);}

  /* Resource links */
  .res{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .res a{
    text-decoration:none; font-size:12px; color:var(--tab);
    border:1px solid var(--paper-line); border-radius:4px;
    padding:6px 11px; background:var(--card);
  }
  .res a:hover{border-color:var(--highlight); background:var(--highlight-soft);}

  /* Notes */
  .note-area{
    width:100%; min-height:72px; border:1px dashed var(--paper-line); border-radius:4px;
    background:var(--card); color:var(--ink); font-family:'IBM Plex Mono',monospace;
    font-size:12.5px; padding:9px 11px; resize:vertical; margin-top:8px;
  }
  .note-area:focus{outline:none; border-color:var(--highlight);}

  /* Buttons */
  .btn{
    background:var(--tab); color:#fff; border:none; border-radius:5px;
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; padding:8px 15px; cursor:pointer;
  }
  .btn:hover{opacity:.9;}
  .btn.ghost{background:none; border:1px solid var(--paper-line); color:var(--ink-soft);}
  .btn.ghost:hover{border-color:var(--ink-soft); color:var(--ink);}
  .btn.amber{background:var(--highlight); color:var(--tab); font-weight:600;}

  /* Quiz full page */
  .quiz-opt{display:block; width:100%; text-align:left;
    padding:11px 13px; border:1px solid var(--paper-line); border-radius:6px;
    margin:7px 0; font-family:'IBM Plex Mono',monospace; font-size:13px; cursor:pointer;
    background:var(--card); color:var(--ink); line-height:1.5;}
  .quiz-opt:hover{border-color:var(--highlight);}
  .quiz-opt.correct{border-color:var(--done); background:var(--done-bg); font-weight:600;}
  .quiz-opt.wrong{border-color:var(--bad); background:var(--bad-bg);}
  .quiz-opt:disabled{cursor:default;}
  .quiz-opt:disabled:hover{border-color:var(--paper-line);}
  .quiz-opt.correct:disabled:hover{border-color:var(--done);}
  .quiz-opt.wrong:disabled:hover{border-color:var(--bad);}
  .qnum{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);}
  .score-big{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px;}

  /* Cheatsheet */
  .cheat-sect{margin-bottom:8px;}
  .cheat-sect h4{font-family:'Space Grotesk',sans-serif; font-size:13px; margin:14px 0 6px; color:var(--tab);}
  .cheat-sect table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .cheat-sect td{border:1px solid var(--paper-line); padding:7px 10px; vertical-align:top; line-height:1.5;}
  .cheat-sect td code{background:var(--paper); padding:1px 5px; border-radius:3px; font-size:11.5px;}
  .cheat-sect tr:nth-child(even) td{background:rgba(36,38,69,.02);}

  /* Glossary */
  .gloss-item{padding:10px 2px; border-bottom:1px dotted var(--paper-line);}
  .gloss-item:last-child{border-bottom:none;}
  .gloss-term{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; color:var(--tab);}
  .gloss-def{font-size:12.5px; color:var(--ink); line-height:1.55; margin-top:3px;}

  /* Project milestones */
  .milestone{background:var(--card); border:1px solid var(--paper-line); border-radius:6px; margin-top:14px; overflow:hidden;}
  .milestone .m-head{padding:12px 15px; border-bottom:1px solid var(--paper-line);
    display:flex; justify-content:space-between; align-items:center;}
  .milestone .m-title{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;}
  .milestone .m-body{padding:12px 15px;}
  .milestone .m-body p{font-size:12.5px; line-height:1.6; margin:0 0 8px;}

  footer{margin-top:36px; text-align:center; font-size:11px; color:var(--ink-soft);}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--tab); color:#fff; font-size:12.5px; padding:10px 18px;
    border-radius:6px; box-shadow:0 4px 14px var(--shadow); opacity:0;
    transition:opacity .3s; z-index:100; pointer-events:none;
  }
  .toast.show{opacity:1;}

  /* Time badge */
  .time-badge{
    display:inline-flex; align-items:center; gap:5px;
    font-size:10.5px; letter-spacing:.05em; color:var(--ink-soft);
    border:1px solid var(--paper-line); border-radius:3px;
    padding:2px 8px; margin-left:8px; white-space:nowrap;
  }
  .time-badge svg{width:11px;height:11px;}

  /* Diagram (minh họa sinh động) */
  .diagram{
    background:
      radial-gradient(120% 120% at 0% 0%, #FFFDF8 0%, #F6F3EC 45%, #F1ECDF 100%);
    border:1px solid var(--paper-line);
    border-radius:10px;
    margin:14px 0;
    padding:16px 14px 12px;
    text-align:center;
    position:relative;
    overflow:hidden;
    box-shadow:inset 0 0 40px rgba(36,38,69,.03);
  }
  .diagram::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(2px 2px at 20% 30%, rgba(232,163,61,.18), transparent),
      radial-gradient(2px 2px at 80% 20%, rgba(62,125,92,.15), transparent),
      radial-gradient(2px 2px at 60% 80%, rgba(176,73,63,.12), transparent),
      radial-gradient(1px 1px at 40% 60%, rgba(46,49,89,.15), transparent);
    pointer-events:none;
  }
  .diagram .d-label{
    display:inline-block; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); background:var(--card); border:1px solid var(--paper-line);
    padding:2px 9px; border-radius:3px; margin-bottom:8px;
  }
  .diagram svg{max-width:100%; height:auto; display:block; margin:0 auto;}
  .diagram .cap{
    font-size:11.5px; color:var(--ink-soft); margin-top:10px; line-height:1.55;
    background:var(--highlight-soft); border-left:3px solid var(--highlight);
    padding:7px 11px; border-radius:0 4px 4px 0; text-align:left;
  }
  /* Animations */
  @keyframes dashmove{to{stroke-dashoffset:-24;}}
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @keyframes glow{0%,100%{opacity:.35;}50%{opacity:1;}}
  @keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.18);}100%{transform:scale(1);}}
  @keyframes wigglex{0%,100%{transform:translateX(0);}50%{transform:translateX(-5px);}}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  @keyframes flashcolor{
    0%,100%{fill:#E8A33D;}
    50%{fill:#B0493F;}
  }
  @keyframes slidein{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:none;}}
  .diagram .flow{stroke-dasharray:6 6; animation:dashmove 1.4s linear infinite;}
  .diagram .floaty{animation:floaty 2.4s ease-in-out infinite;}
  .diagram .fadein{animation:fadein .7s ease both;}
  .diagram .glow{animation:glow 1.8s ease-in-out infinite;}
  .diagram .pulse{transform-origin:center; transform-box:fill-box; animation:pop 1.6s ease-in-out infinite;}
  .diagram .dotpulse{animation:glow 1.6s ease-in-out infinite;}
  .diagram .wiggle{animation:wigglex 1.3s ease-in-out infinite;}
  .diagram .spinner{transform-origin:center; transform-box:fill-box; animation:spin 3s linear infinite;}
  .diagram .flash{animation:flashcolor 1.6s ease-in-out infinite;}
  .diagram .slidein{animation:slidein .8s ease both;}
  .diagram .rainbow{
    animation:flashcolor 2s ease-in-out infinite;
  }
  .diagram .stagger *{animation:slidein .7s ease both;}
  .diagram .stagger *:nth-child(2){animation-delay:.15s;}
  .diagram .stagger *:nth-child(3){animation-delay:.3s;}
  .diagram .stagger *:nth-child(4){animation-delay:.45s;}
  .diagram .stagger *:nth-child(5){animation-delay:.6s;}
  .diagram .stagger *:nth-child(6){animation-delay:.75s;}

  /* Print button */
  .print-btn{
    margin-left:auto; background:none; border:1px solid var(--paper-line);
    color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;
    font-size:11.5px; padding:6px 11px; border-radius:4px; cursor:pointer;
  }
  .print-btn:hover{border-color:var(--ink-soft); color:var(--ink);}

  /* Final exam */
  .final-score{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:30px; color:var(--tab);
  }
  .final-meta{font-size:12.5px; color:var(--ink-soft); line-height:1.6;}
  .final-badge{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft);
    border:1px solid var(--paper-line); border-radius:3px; padding:2px 7px; margin-right:6px;
  }

  /* Print styles */
  @media print{
    body{background:#fff;}
    .nav{display:none;}
    .back{display:none;}
    footer{display:none;}
    .toast{display:none;}
    .print-btn{display:none;}
    .wrap{max-width:100%;padding:0;}
    .card{box-shadow:none;break-inside:avoid;}
    .cheat-sect table{font-size:10.5px;}
    .cheat-sect td{padding:5px 7px;}
    h1{font-size:22px;}
  }
</style>
</head>
<body>
<nav class="nav" id="topnav">
  <span class="brand">ML · Tự học</span>
  <a class="tab" href="#/" data-nav="dash">Tổng quan</a>
  <a class="tab" href="#/cheatsheet" data-nav="cheat">Cheatsheet</a>
  <a class="tab" href="#/glossary" data-nav="gloss">Thuật ngữ</a>
  <a class="tab" href="#/projects" data-nav="proj">Đồ án</a>
  <a class="tab" href="#/exam" data-nav="exam">Kiểm tra cuối</a>
</nav>

<div class="wrap" id="app"></div>

<footer>Nhập môn Học máy · Khóa 11 tuần · Dữ liệu chỉ lưu trên trình duyệt của bạn.</footer>
<div class="toast" id="toast"></div>

<!-- DỮ LIỆU & SƠ ĐỒ đã tách sang file riêng để dễ sửa -->
<script src="data.js"></script>
<script src="diagrams.js"></script>
<script>
/* ===================================================================
   TRẠNG THÁI & HIỂN THỊ (logic chính)
   =================================================================== */
const SKEY = "ml-studyhub-v1";
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(SKEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { checks:{}, notes:{} };
}
function save(){
  try{ localStorage.setItem(SKEY, JSON.stringify(state)); }catch(e){}
}

/* Progress helpers */
function weekChecks(w){
  const list = [];
  if(w.lesson1) w.lesson1.checklist.forEach((_,i)=>list.push(`w${w.id}l1${i}`));
  if(w.lesson2) w.lesson2.checklist.forEach((_,i)=>list.push(`w${w.id}l2${i}`));
  if(w.assignment) w.assignment.checklist.forEach((_,i)=>list.push(`w${w.id}a${i}`));
  return list;
}
function weekDoneCount(w){
  return weekChecks(w).filter(k=>state.checks[k]).length;
}
function weekTotalCount(w){
  return weekChecks(w).length;
}
function allWeekKeys(){
  let keys=[];
  WEEKS.forEach(w=>{ weekChecks(w).forEach(k=>keys.push(k)); });
  return keys;
}
function overallPct(){
  const keys = allWeekKeys();
  if(!keys.length) return 0;
  const done = keys.filter(k=>state.checks[k]).length;
  return Math.round(done/keys.length*100);
}
function weekDone(w){
  const t=weekTotalCount(w); return t>0 && weekDoneCount(w)===t;
}

/* Render router */
const app = document.getElementById("app");
const navTabs = document.querySelectorAll(".nav a[data-nav]");

function setActiveNav(name){
  navTabs.forEach(a=>{
    a.classList.toggle("active", a.dataset.nav===name);
  });
}

function router(){
  const hash = location.hash || "#/";
  if(hash.startsWith("#/week/")){
    const id = parseInt(hash.split("/")[2],10);
    const w = WEEKS.find(x=>x.id===id);
    if(w) renderWeek(w); else renderDashboard();
  }
  else if(hash === "#/cheatsheet") renderCheatsheet();
  else if(hash === "#/glossary") renderGlossary();
  else if(hash === "#/projects") renderProjects();
  else if(hash === "#/exam") renderExam();
  else renderDashboard();
}

function renderDashboard(){
  setActiveNav("dash");
  const doneCount = overallPct();
  const next = WEEKS.find(w=>!weekDone(w));

  const weekCards = WEEKS.map(w=>{
    const done = weekDone(w);
    const dc = weekDoneCount(w), tc = weekTotalCount(w);
    const pct = tc? Math.round(dc/tc*100):0;
    const status = done ? 'Hoàn thành' : (tc? `Đang học · ${dc}/${tc}` : 'Chưa bắt đầu');
    return `<div class="tl-item ${done?'done':''}" onclick="location.hash='#/week/${w.id}'">
      <div class="tl-num">T${String(w.id).padStart(2,"0")}</div>
      <div class="tl-info">
        <div class="tl-title">${w.title} ${w.isProjectWeek?'· 🎓 Đồ án':''}</div>
        <div class="tl-sub">${w.sub}</div>
        <div class="tl-status">${status}</div>
      </div>
    </div>`;
  }).join("");

  app.innerHTML = `
    <header>
      <div class="eyebrow">Trang tự học · ${COURSE.duration}</div>
      <h1>${COURSE.name}</h1>
      <div class="sub">${COURSE.tagline}</div>
    </header>

    <div class="card progress-panel">
      <div class="card-body">
        <div class="progress-top">
          <span class="progress-label">Tiến độ toàn khóa</span>
          <span class="progress-num">${doneCount}%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${doneCount}%"></div></div>
        <div class="progress-meta">${allWeekKeys().filter(k=>state.checks[k]).length} / ${allWeekKeys().length} bước thực hành đã hoàn thành</div>

    ${next ? `

        <p style="margin:0;font-size:13px;line-height:1.6"><b style="font-family:'Space Grotesk'">${next.title}</b> — ${next.sub}</p>
        <div class="res" style="margin-top:10px"><a href="#/week/${next.id}">Vào học →</a></div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><span class="title">🎯 Kiểm tra cuối khóa</span></div>
      <div class="card-body">
        <p style="margin:0 0 10px;font-size:12.5px;color:var(--ink-soft)">Làm tổng hợp toàn bộ câu hỏi của 11 tuần, xem điểm ôn tập.</p>
        <div class="res"><a href="#/exam">Vào kiểm tra →</a></div>
      </div>
    </div>`: `
    <div class="card" style="border-color:var(--done)">
      <div class="card-head"><span class="title">🏁 Chúc mừng! Bạn đã hoàn thành khóa học</span></div>
      <div class="card-body"><p style="margin:0;font-size:13px">Hãy ôn lại bằng cheatsheet, thuật ngữ, và tiếp tục với deep learning nhé.</p></div>
    </div>`}

    <div class="card">
      <div class="card-head"><span class="title">Thông tin khóa học</span></div>      <div class="card-body" style="font-size:12.5px;line-height:1.7">
        <div><b>Lịch:</b> ${COURSE.schedule} · <b>Tự học:</b> ${COURSE.selfstudy}</div>
        <div><b>Đối tượng:</b> ${COURSE.audience}</div>
        <div><b>Đầu vào:</b> ${COURSE.prereq}</div>
        <div><b>Công cụ:</b> ${COURSE.tools}</div>
        <div style="margin-top:8px"><b>Thang điểm:</b></div>
        ${COURSE.grading.map(g=>`<div style="margin-left:10px">• ${g.part} <b>(${g.pct})</b> — ${g.desc}</div>`).join("")}
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span class="title">Lộ trình 11 tuần</span></div>
      <div class="card-body">
        ${weekCards}
      </div>
    </div>
  `;
}

function renderWeek(w){
  setActiveNav("dash");
  const done = weekDone(w);
  const dc = weekDoneCount(w), tc = weekTotalCount(w);
  const pct = tc? Math.round(dc/tc*100):0;

  const estMap = { l1:"≈ 2 giờ · lý thuyết", l2:"≈ 2 giờ · thực hành", a:"≈ 1–2 giờ" };
  const timeBadge = (prefix)=>`
    <span class="time-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      ${estMap[prefix]||""}
    </span>`;

  const lessonBlock = (key, les, prefix)=>{
    if(!les) return "";
    const theory = (les.theory||[]).map(t=>`<p>${t}</p>`).join("");
    const diagram = getDiagram(w.id, prefix, les);
    const code = les.code? `<div class="code">${escapeCode(les.code)}</div>`:"";
    const concept = les.concept? `<div class="concept">💡 ${les.concept}</div>`:"";
    const checks = (les.checklist||[]).map((c,i)=>{
      const k = `w${w.id}${prefix}${i}`;
      const chk = !!state.checks[k];
      return `<div class="check ${chk?'done':''}">
        <input type="checkbox" id="${k}" ${chk?'checked':''} onchange="toggleCheck('${k}')">
        <label class="t" for="${k}">${c}</label>
      </div>`;
    }).join("");
    return `
      <div class="lesson">
        <div class="l-head">${les.title}${timeBadge(prefix)}</div>
        <div class="l-meta">${les.meta}</div>
        ${theory}
        ${diagram}
        ${concept}
        ${code}
        <div style="margin-top:10px"><b style="font-size:12.5px">Checklist thực hành</b></div>
        ${checks || '<p style="font-size:12.5px;color:var(--ink-soft)">Chưa có bước thực hành.</p>'}
      </div>`;
  };

  const assignBlock = w.assignment ? `
    <div class="lesson">
      <div class="l-head">📝 ${w.assignment.title}${timeBadge('a')}</div>
      <p>${w.assignment.desc}</p>
      ${(w.assignment.checklist||[]).map((c,i)=>{
        const k=`w${w.id}a${i}`; const chk=!!state.checks[k];
        return `<div class="check ${chk?'done':''}"><input type="checkbox" id="${k}" ${chk?'checked':''} onchange="toggleCheck('${k}')"><label class="t" for="${k}">${c}</label></div>`;
      }).join("")}
    </div>` : (w.isProjectWeek?`<div class="lesson"><div class="concept">🎓 Tuần đồ án — không có bài tập & quiz, toàn bộ thời gian làm đồ án.</div></div>`:"");

  const selfBlock = (w.selfcheck&&w.selfcheck.length)? `
    <div class="lesson">
      <div class="l-head">❓ Câu hỏi tự kiểm tra (cuối tuần)</div>
      ${w.selfcheck.map((q,i)=>`
        <div class="q" id="sq${w.id}-${i}">
          <div class="qt">${i+1}. ${q.q}</div>
          ${q.opts.map((o,oi)=>`<div class="opt" onclick="answerSelf('sq${w.id}-${i}', ${oi}, ${q.a}, ${i})">${o}</div>`).join("")}
          <div class="explain">${q.why}</div>
        </div>`).join("")}
    </div>`:"";

  const quizBlock = (w.quiz&&w.quiz.length)? `
    <div class="card" style="margin-top:18px">
      <div class="card-head"><span class="title">📊 Quiz tuần ${w.id}</span></div>
      <div class="card-body">
        ${w.quiz.map((q,qi)=>`
          <div class="q" id="q${w.id}-${qi}">
            <div class="qt">${qi+1}. ${q.q}</div>
            ${q.opts.map((o,oi)=>`<div class="opt" onclick="answerQ('q${w.id}-${qi}', ${oi}, ${q.a}, ${qi})">${o}</div>`).join("")}
            <div class="explain">${q.why}</div>
          </div>`).join("")}
      </div>
    </div>`:"";

  const links = (w.lesson1||w.lesson2||w.assignment)? `
    <div class="card">
      <div class="card-head"><span class="title">🔗 Tài nguyên & liên kết</span></div>
      <div class="card-body">
        <div class="res">
          <a target="_blank" rel="noopener" href="https://colab.research.google.com/">Mở Google Colab mới</a>
          <a target="_blank" rel="noopener" href="https://scikit-learn.org/stable/user_guide.html">scikit-learn docs</a>
          <a target="_blank" rel="noopener" href="https://pandas.pydata.org/docs/">pandas docs</a>
          <a target="_blank" rel="noopener" href="https://numpy.org/doc/">NumPy docs</a>
        </div>
        <div style="margin-top:12px;font-size:12px;color:var(--ink-soft)">Gợi ý: tạo notebook mới trong Colab và thực hành từng bước theo checklist bên trên.</div>
      </div>
    </div>`:"";

  const notes = `
    <div class="card">
      <div class="card-head"><span class="title">📓 Ghi chú của bạn</span></div>
      <div class="card-body">
        <textarea class="note-area" id="note-${w.id}" placeholder="Viết ghi chú, thắc mắc, link bạn muốn nhớ ở tuần này..." oninput="saveNote(${w.id}, this.value)">${escapeHtml(state.notes['w'+w.id]||'')}</textarea>
      </div>
    </div>`;

  app.innerHTML = `
    <a class="back" href="#/">← Tổng quan</a>
    <header>
      <div class="eyebrow"><span class="week-tag ${done?'':''}">Tuần ${w.id}${w.isProjectWeek?' · Đồ án':''}</span><span class="week-tag mini">${pct}% hoàn thành</span></div>
      <h1>${w.title}</h1>
      <div class="sub">${w.sub}</div>
    </header>

    <div class="progress-panel">
      <div class="progress-top"><span class="progress-label">Tiến độ tuần</span><span class="progress-num">${dc}/${tc}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="card">
      <div class="card-head"><span class="title">Bài học</span></div>
      <div class="card-body">
        ${lessonBlock('l1', w.lesson1, 'l1')}
        ${lessonBlock('l2', w.lesson2, 'l2')}
        ${assignBlock}
        ${selfBlock}
      </div>
    </div>

    ${quizBlock}
    ${links}
    ${notes}
  `;
}

function renderExam(){
  setActiveNav("exam");
  // Gộp toàn bộ câu hỏi quiz của các tuần (bỏ tuần đồ án không có quiz)
  const exam = [];
  WEEKS.forEach(w=>{
    if(!w.quiz || !w.quiz.length) return;
    w.quiz.forEach(q=>{
      exam.push({ week:w.id, q:q.q, opts:q.opts, a:q.a, why:q.why });
    });
  });
  const total = exam.length;
  const answered = state.answers ? Object.keys(state.answers).length : 0;
  const correct = state.answers ? Object.values(state.answers).filter(a=>a).length : 0;
  const pct = total? Math.round(correct/total*100):0;

  // Lọc câu chưa trả lời để ôn tập
  const unAnsw = exam.filter((_,i)=>!(state.answers&&state.answers[i]!==undefined));

  app.innerHTML = `
    <a class="back" href="#/">← Tổng quan</a>
    <header>
      <div class="eyebrow">Ôn tập toàn khóa</div>
      <h1>Kiểm tra cuối khóa</h1>
      <div class="sub">Gộp toàn bộ ${total} câu hỏi quiz của 11 tuần thành một bài kiểm tra tổng. Trả lời được tự lưu, xem lại điểm bất cứ lúc nào.</div>
    </header>

    <div class="card">
      <div class="card-body" style="display:flex; align-items:center; gap:18px; flex-wrap:wrap">
        <div><span class="final-score">${pct}%</span><br><span class="final-meta">${correct} / ${total} đúng</span></div>
        <div style="flex:1;min-width:180px">
          <div class="progress-track" style="height:12px"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-meta">Đã trả lời ${answered}/${total} · đúng ${correct}</div>
        </div>
      </div>
    </div>

    ${unAnsw.length? `
    <div class="card" style="border-color:var(--highlight)">
      <div class="card-head"><span class="title">📌 Còn ${unAnsw.length} câu chưa trả lời</span></div>
      <div class="card-body" style="font-size:12.5px;color:var(--ink-soft)">Tiếp tục làm bên dưới, hoặc quay lại ôn các tuần chưa chắc.</div>
    </div>`:""}

    <div class="card">
      <div class="card-head"><span class="title">Đề thi tổng (${total} câu)</span></div>
      <div class="card-body">
        ${exam.map((item, i)=>{
          const ans = state.answers && state.answers[i]!==undefined ? state.answers[i] : null;
          return `
          <div class="q" id="ex-${i}" ${ans!==null?'data-answered="1"':''}>
            <div class="qt">
              <span class="final-badge">Tuần ${item.week}</span>
              ${i+1}. ${item.q}
            </div>
            ${item.opts.map((o,oi)=>{
              let cls = "";
              if(ans!==null){
                if(oi===item.a) cls=" correct";
                else if(oi===ans) cls=" wrong";
              }
              return `<div class="opt${cls}" ${ans!==null?'disabled':''} onclick="answerExam(${i}, ${oi}, ${item.a})">${o}</div>`;
            }).join("")}
            <div class="explain ${ans!==null?'show':''}">${item.why}</div>
          </div>`;
        }).join("")}
      </div>
    </div>
  `;
}

function answerExam(idx, chosen, correct){
  if(!state.answers) state.answers = {};
  if(state.answers[idx] !== undefined) return; // đã trả lời
  state.answers[idx] = (chosen === correct);
  save();
  renderExam(); // cập nhật điểm
}

      <h1>Kho đồ án</h1>

    </header>
    <div class="card">
      <div class="card-body">
        <div class="progress-top"><span class="progress-label">Tiến độ đồ án</span><span class="progress-num">${pct}%</span></div>

      return `<div class="milestone">
        <div class="m-head">
          <div class="m-title">${p.title}</div>
          <div class="m-body" style="padding:0;font-size:12px;color:var(--ink-soft)"><span class="week-tag mini">${p.weight}</span> ${pdc}/${p.checklist.length}</div>
        </div>
        <div class="m-body">
          <p><b>Trọng tâm:</b> ${p.focus}</p>
          <p>${p.desc}</p>
          ${p.checklist.map((c,i)=>{
            const k=`${p.week}-${i}`; const chk=!!state.checks[k];
            return `<div class="check ${chk?'done':''}"><input type="checkbox" id="${k}" ${chk?'checked':''} onchange="toggleCheck('${k}')"><label class="t" for="${k}">${c}</label></div>`;
          }).join("")}
        </div>
      </div>`;
    }).join("")}
  `;
}

/* ===================================================================
   INTERACTIONS
   =================================================================== */
function toggleCheck(key){
  state.checks[key] = !state.checks[key];
  save();
  // re-render current week to update progress without losing scroll
  const hash = location.hash;
  if(hash.startsWith("#/week/")){
    const id = parseInt(hash.split("/")[2],10);
    const w = WEEKS.find(x=>x.id===id);
    renderWeek(w);
  } else if(hash === "#/projects"){
    renderProjects();
  } else {
    renderDashboard();
  }
}
function saveNote(id, val){
  state.notes['w'+id] = val;
  save();
}

function answerSelf(containerId, chosen, correct, idx){
  const el = document.getElementById(containerId);
  if(!el || el.dataset.answered) return;
  el.dataset.answered = "1";
  const opts = el.querySelectorAll(".opt");
  opts.forEach(o=>o.classList.remove("correct","wrong"));
  opts[correct].classList.add("correct");
  if(chosen !== correct) opts[chosen].classList.add("wrong");
  el.querySelector(".explain").classList.add("show");
}
function answerQ(containerId, chosen, correct, idx){
  const el = document.getElementById(containerId);
  if(!el || el.dataset.answered) return;
  el.dataset.answered = "1";
  const opts = el.querySelectorAll(".opt");
  opts.forEach(o=>{ o.disabled = true; o.classList.remove("correct","wrong"); });
  opts[correct].classList.add("correct");
  if(chosen !== correct) opts[chosen].classList.add("wrong");
  el.querySelector(".explain").classList.add("show");
}

/* Escape helpers */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function escapeCode(c){
  // basic: highlight keywords, strings, comments
  const esc = escapeHtml(c);
  return esc;
}

window.addEventListener("hashchange", router);
router();
